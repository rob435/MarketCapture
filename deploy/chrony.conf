# A capture host's clock, as /etc/chrony/chrony.conf. Every row the recorder
# writes carries this clock as `local_receive_ts_ns`, so its error is the
# receive stamp's.
#
# Written for a Singapore host, which Google's four stratum-1 servers answer
# from about 1 ms with a root delay of 0. Cloudflare's Singapore servers and
# most of sg.pool.ntp.org are as near but follow upstreams 70-150 ms away, and
# read 2-3 ms off Google's there. Elsewhere, pick the nearest stratum 1 with
# the lowest root delay (`chronyc sources -v`, `chronyc ntpdata`). Google
# smears a leap second over 24 h, as Amazon's time service does for Bybit's
# servers, so there is no `leapsectz`: chrony would apply the leap a second
# time.
server time1.google.com iburst minpoll 4 maxpoll 6
server time2.google.com iburst minpoll 4 maxpoll 6
server time3.google.com iburst minpoll 4 maxpoll 6
server time4.google.com iburst minpoll 4 maxpoll 6
# Meta's stratum 1, another operator's clock beside Google's in
# `chronyc sources`; never followed.
server time2.facebook.com iburst noselect

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
# Step only in the first three updates after chronyd starts; slew after.
makestep 1 3
rtcsync
